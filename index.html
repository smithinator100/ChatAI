<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck.ai</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lottie Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
<div class="container">
    <div class="drag-bg dotted-border"></div>
    <div class="chat-content">
        <div class="chat-stack">
            <div class="placeholder-chat">
                <div id="logo-to-plus-lottie" class="lottie-wrapper"></div>
                <div id="arrow-lottie" class="arrow-lottie-wrapper"></div>
                <h4 class="logo-title">
                    <span class="title-text title-text--default">Duck.ai</span>
                    <span class="title-text title-text--active">Drop your image here</span>
                    <span class="subtitle-text">Max 5 images per chat up to 10mb each</span>
                </h4>
            </div>
        </div>
        <div class="chat-input">
            <div class="input">
                <p>Chat with GPT-4o</p>
            </div>
            <div class="disclaimer">
                <p>You are chatting with GPT-4o. AI chats may display inaccurate or offensive information.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
